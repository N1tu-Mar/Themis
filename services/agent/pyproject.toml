[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-agent"
version = "0.1.0"
description = "Themis single-orchestrator dispute agent (AgentCore Runtime)"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.35"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
