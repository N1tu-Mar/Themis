[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-merchant-intel"
version = "0.1.0"
description = "Cache-first, time-aware synthetic merchant intelligence for Themis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["merchant_intel*"]

[tool.setuptools.package-data]
merchant_intel = ["schemas.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
